version: "3.9"

networks:
  voxspeak-network:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  qdrant_storage:
  minio_data:
  ollama_data:
  prometheus_data:
  grafana_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: voxspeak-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: voxspeak
      POSTGRES_USER: voxspeak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxspeak_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - voxspeak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxspeak"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voxspeak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - voxspeak-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: voxspeak-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - voxspeak-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: voxspeak-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-voxspeak}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-voxspeak_minio_secret}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - voxspeak-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: voxspeak-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - voxspeak-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
    container_name: voxspeak-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://voxspeak:${POSTGRES_PASSWORD:-voxspeak_secret}@postgres:5432/voxspeak
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-voxspeak}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-voxspeak_minio_secret}
      MINIO_BUCKET: voxspeak
      MINIO_USE_SSL: "false"
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
    networks:
      - voxspeak-network

  ai-service:
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
    container_name: voxspeak-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_URL: http://ollama:11434
      MODEL_SIZE: base
      PYTHONUNBUFFERED: "1"
    networks:
      - voxspeak-network

  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    container_name: voxspeak-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://api:3001}
    networks:
      - voxspeak-network
