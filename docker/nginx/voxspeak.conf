# VoxSpeak main server block
# Include this from nginx.conf or place in /etc/nginx/sites-enabled/

server {
    listen 443 ssl http2;
    server_name voxspeak.app www.voxspeak.app;

    ssl_certificate /etc/nginx/ssl/voxspeak/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/voxspeak/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/voxspeak/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 4h;
    ssl_session_tickets off;
    ssl_buffer_size 4k;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    access_log /var/log/nginx/voxspeak.access.log main buffer=512k flush=1m;
    error_log /var/log/nginx/voxspeak.error.log warn;

    # API proxy
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn addr 20;

        proxy_pass http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # WebSocket
    location /ws {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_next_upstream error timeout;
    }

    # AI Service
    location /ai/ {
        limit_req zone=ai_limit burst=10 nodelay;

        proxy_pass http://ai-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Frontend
    location / {
        limit_req zone=general_limit burst=100 nodelay;
        limit_conn addr 50;

        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;

        proxy_next_upstream error timeout http_500 http_502;
        proxy_next_upstream_tries 3;

        # Static asset caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|avif|mp4|webm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, no-transform";
            access_log off;
            log_not_found off;
        }

        location ~* \.(json|xml)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # Security: deny sensitive paths
    location ~ /\.(env|git|svn|hg|idea|vscode) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (\.env|\.gitignore|Dockerfile|docker-compose\.yml|Makefile|composer\.json|package\.json|tsconfig) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# HTTP redirect
server {
    listen 80;
    server_name voxspeak.app www.voxspeak.app;
    return 301 https://$host$request_uri;
}
