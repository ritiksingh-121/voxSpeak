global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  # - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "voxspeak-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3001"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "voxspeak-api"
    scrape_interval: 10s

  - job_name: "voxspeak-ai-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "voxspeak-ai-service"
    scrape_interval: 10s

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 30s

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 30s

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 30s

  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: "docker"
    static_configs:
      - targets: ["cadvisor:8080"]
    scrape_interval: 30s
